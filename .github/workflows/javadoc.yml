name: Generate Javadoc

on:
  push:
    branches:
      - main
      - develop

jobs:
  javadoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Javadoc
        run: mvn javadoc:javadoc
